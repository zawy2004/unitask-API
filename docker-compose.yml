services:
  api:
    build: .
    image: unitask-api:latest
    container_name: unitask-api
    restart: unless-stopped
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      # App bind trên [::]:8080 (IPv6, cũng nhận IPv4 qua docker-proxy). Healthcheck dùng [::1].
      test: ["CMD", "wget", "-q", "-O-", "http://[::1]:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
