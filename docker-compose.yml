services:
  api:
    build: .
    image: unitask-api:latest
    container_name: unitask-api
    restart: unless-stopped
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Bind cả IPv4 + IPv6 để healthcheck (127.0.0.1) và mọi client đều kết nối được.
      ASPNETCORE_URLS: "http://0.0.0.0:8080;http://[::]:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
